name: Greetings

on: [pull_request_target, issues]

jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
      with:
        repo-token: ${{ secrets.GITHUB_TOKEN }}
        issue-message: |
            Thank you for opening your first issue. Please review the repository documentation and contribution guidelines to help us evaluate and respond to your request effectively.
        pr-message: |
            Thank you for your first pull request. Please ensure your changes follow the contribution guidelines and include relevant context for review.
